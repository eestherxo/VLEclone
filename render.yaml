services:
  - type: web
    name: vleclone
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend
      npm install
      npm run build
      cd ..
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT "app.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
